apiVersion: apps/v1
kind: Deployment
metadata:
  name: labfactory-dashboard
  namespace: labfactory
spec:
  # NOTE: Pour scaler à replicas > 1, il faut configurer un store de sessions Redis
  # (connect-redis) pour éviter les problèmes de sessions entre les pods.
  replicas: 1
  selector:
    matchLabels:
      app: labfactory-dashboard
  template:
    metadata:
      labels:
        app: labfactory-dashboard
    spec:
      serviceAccountName: labfactory-dashboard
      initContainers:
        # Attend que PostgreSQL soit prêt avant de démarrer (les migrations tournent au démarrage)
        - name: wait-for-postgres
          image: postgres:17-alpine
          command:
            - sh
            - -c
            - until pg_isready -h postgres -p 5432 -U labfactory; do echo "Attente de PostgreSQL..."; sleep 2; done
      containers:
        - name: dashboard
          image: hurtlinb/labfactory:dashboard-1.0.5
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 3000
          env:
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: labfactory-secrets
                  key: database-url
            - name: REDIS_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: labfactory-secrets
                  key: redis-password
            - name: SESSION_SECRET
              valueFrom:
                secretKeyRef:
                  name: labfactory-secrets
                  key: session-secret
            - name: PROXMOX_API_TOKEN_ID
              valueFrom:
                secretKeyRef:
                  name: labfactory-secrets
                  key: proxmox-token-id
            - name: PROXMOX_API_TOKEN_SECRET
              valueFrom:
                secretKeyRef:
                  name: labfactory-secrets
                  key: proxmox-token-secret
            - name: OIDC_CLIENT_SECRET
              valueFrom:
                secretKeyRef:
                  name: labfactory-secrets
                  key: oidc-client-secret
          envFrom:
            - configMapRef:
                name: labfactory-config
          resources:
            requests:
              cpu: "200m"
              memory: "256Mi"
            limits:
              cpu: "1000m"
              memory: "512Mi"
          livenessProbe:
            httpGet:
              path: /
              port: 3000
            initialDelaySeconds: 30
            periodSeconds: 15
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /
              port: 3000
            initialDelaySeconds: 10
            periodSeconds: 5
---
apiVersion: v1
kind: Service
metadata:
  name: labfactory-dashboard
  namespace: labfactory
spec:
  selector:
    app: labfactory-dashboard
  ports:
    - port: 3000
      targetPort: 3000
  type: ClusterIP
