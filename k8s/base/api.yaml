apiVersion: apps/v1
kind: Deployment
metadata:
  name: labfactory-api
spec:
  replicas: 1
  selector:
    matchLabels:
      app: labfactory-api
  template:
    metadata:
      labels:
        app: labfactory-api
    spec:
      serviceAccountName: labfactory-api
      containers:
        - name: api
          image: labfactory/api:latest
          ports:
            - containerPort: 3000
          env:
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: labfactory-secrets
                  key: database-url
            - name: REDIS_HOST
              value: redis
            - name: REDIS_PORT
              value: '6379'
            - name: LOG_LEVEL
              value: info
---
apiVersion: v1
kind: Service
metadata:
  name: labfactory-api
spec:
  selector:
    app: labfactory-api
  ports:
    - port: 3000
      targetPort: 3000
  type: ClusterIP
