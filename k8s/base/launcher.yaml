apiVersion: apps/v1
kind: Deployment
metadata:
  name: labfactory-launcher
spec:
  replicas: 1
  selector:
    matchLabels:
      app: labfactory-launcher
  template:
    metadata:
      labels:
        app: labfactory-launcher
    spec:
      serviceAccountName: labfactory-launcher
      containers:
        - name: launcher
          image: labfactory/launcher:latest
          env:
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: labfactory-secrets
                  key: database-url
            - name: REDIS_HOST
              value: redis
            - name: REDIS_PORT
              value: '6379'
            - name: LOG_LEVEL
              value: info
