apiVersion: apps/v1
kind: Deployment
metadata:
  name: labfactory-terraform-worker
  namespace: labfactory-dev
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: labfactory-terraform-worker
  template:
    metadata:
      labels:
        app: labfactory-terraform-worker
    spec:
      imagePullSecrets:
        - name: dockerhub-pull-secret
      containers:
        - name: terraform-worker
          image: hurtlinb/labfactory:worker-1.2.5
          imagePullPolicy: Always
          command: ["npm", "run", "terraform-worker"]
          env:
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: labfactory-secrets
                  key: database-url
            - name: PG_CONN_STR
              valueFrom:
                secretKeyRef:
                  name: labfactory-secrets
                  key: database-url
            - name: PGSSLMODE
              value: "disable"
            - name: REDIS_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: labfactory-secrets
                  key: redis-password
            - name: PROXMOX_API_TOKEN_ID
              valueFrom:
                secretKeyRef:
                  name: labfactory-secrets
                  key: proxmox-token-id
            - name: PROXMOX_API_TOKEN_SECRET
              valueFrom:
                secretKeyRef:
                  name: labfactory-secrets
                  key: proxmox-token-secret
          envFrom:
            - configMapRef:
                name: labfactory-config
          volumeMounts:
            - name: terraform-cache
              mountPath: /usr/src/app/.terraform
          resources:
            requests:
              cpu: "200m"
              memory: "512Mi"
            limits:
              cpu: "1000m"
              memory: "1536Mi"
      volumes:
        - name: terraform-cache
          emptyDir: {}
