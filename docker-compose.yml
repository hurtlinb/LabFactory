services:
  postgres:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: labfactory
      POSTGRES_USER: labfactory
      POSTGRES_PASSWORD: labfactory
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data

  redis:
    image: redis:8-alpine
    restart: unless-stopped
    env_file:
      - .env
    command:
      - redis-server
      - --appendonly
      - "yes"
      - --requirepass
      - ${REDIS_PASSWORD}
    volumes:
      - redis-data:/data

  terraform-worker:
    build: .
    image: lab-orchestrator-demo:latest
    restart: on-failure
    depends_on:
      - redis
    env_file:
      - .env
    volumes:
      - ./terraform:/usr/src/app/terraform:cached
      - ./config:/usr/src/app/config:cached
      - terraform-cache:/usr/src/app/.terraform
    environment:
      - DATABASE_URL=postgresql://labfactory:labfactory@postgres:5432/labfactory
      - TF_IN_AUTOMATION=1
      - TF_DATA_DIR=/usr/src/app/.terraform
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - REDIS_PASSWORD=${REDIS_PASSWORD}
    command: npm run terraform-worker

  ansible-worker:
    build: .
    image: lab-orchestrator-demo:latest
    restart: on-failure
    depends_on:
      redis:
        condition: service_started
      postgres:
        condition: service_started
      custom-tasks-image:
        condition: service_completed_successfully
    env_file:
      - .env
    volumes:
      - ./ansible:/usr/src/app/ansible:cached
      - blueprint-files:/usr/src/app/data/blueprint-files:ro
      - /var/run/docker.sock:/var/run/docker.sock
    environment:
      - DATABASE_URL=postgresql://labfactory:labfactory@postgres:5432/labfactory
      - ANSIBLE_TASKS_IMAGE=${ANSIBLE_TASKS_IMAGE:-labfactory/custom-tasks:1}
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - REDIS_PASSWORD=${REDIS_PASSWORD}
    command: npm run ansible-worker

  # Built by `docker compose build`; worker launches short-lived isolated containers.
  custom-tasks-image:
    build:
      context: .
      dockerfile: docker/custom-tasks/Dockerfile
    image: ${ANSIBLE_TASKS_IMAGE:-labfactory/custom-tasks:1}
    network_mode: none
    entrypoint: ["/bin/true"]

  dashboard:
    build: .
    image: lab-orchestrator-demo:latest
    depends_on:
      - postgres
      - redis
    env_file:
      - .env
    ports:
      - "8080:3000"
    environment:
      - DATABASE_URL=postgresql://labfactory:labfactory@postgres:5432/labfactory
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - REDIS_PASSWORD=${REDIS_PASSWORD}
    command: npm run dashboard
    volumes:
      - ./config:/usr/src/app/config:cached
      - blueprint-files:/usr/src/app/data/blueprint-files
    restart: unless-stopped

volumes:
  postgres-data:
  terraform-cache:
  redis-data:

  blueprint-files:
