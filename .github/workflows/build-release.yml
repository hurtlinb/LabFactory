name: Build & Deploy Prod

on:
  release:
    types: [published]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Get version
        id: version
        # Strip leading 'v' from tag (v1.3.2 → 1.3.2). Fail fast instead of silently building and
        # deploying images tagged "dashboard-"/"worker-" (empty suffix) if GITHUB_REF_NAME is ever
        # blank or malformed — that previously slipped through and broke version tracking in prod.
        run: |
          version="${GITHUB_REF_NAME#v}"
          if [ -z "$version" ]; then
            echo "GITHUB_REF_NAME ('$GITHUB_REF_NAME') did not yield a usable version" >&2
            exit 1
          fi
          echo "version=$version" >> $GITHUB_OUTPUT

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build & push dashboard
        uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/dashboard/Dockerfile
          push: true
          tags: hurtlinb/labfactory:dashboard-${{ steps.version.outputs.version }}
          build-args: BUILD_TAG=${{ steps.version.outputs.version }}
          cache-from: type=registry,ref=hurtlinb/labfactory:dashboard-buildcache
          cache-to: type=registry,ref=hurtlinb/labfactory:dashboard-buildcache,mode=max

      - name: Build & push worker
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile
          push: true
          tags: hurtlinb/labfactory:worker-${{ steps.version.outputs.version }}
          cache-from: type=registry,ref=hurtlinb/labfactory:worker-buildcache
          cache-to: type=registry,ref=hurtlinb/labfactory:worker-buildcache,mode=max

      - name: Update gitops repo (prod)
        env:
          GITLAB_TOKEN: ${{ secrets.GITLAB_TOKEN }}
          GITLAB_GITOPS_REPO_URL: ${{ secrets.GITLAB_GITOPS_REPO_URL }}
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          git clone "https://oauth2:${GITLAB_TOKEN}@${GITLAB_GITOPS_REPO_URL#https://}" gitops
          cd gitops/overlays/prod

          # Update container image tags
          kustomize edit set image \
            labfactory/dashboard=hurtlinb/labfactory:dashboard-${VERSION} \
            labfactory/worker=hurtlinb/labfactory:worker-${VERSION}

          # Update runner images in ConfigMap
          sed -i "s|TERRAFORM_RUNNER_IMAGE:.*|TERRAFORM_RUNNER_IMAGE: \"hurtlinb/labfactory:worker-${VERSION}\"|" configmap-patch.yaml
          sed -i "s|ANSIBLE_RUNNER_IMAGE:.*|ANSIBLE_RUNNER_IMAGE: \"hurtlinb/labfactory:worker-${VERSION}\"|" configmap-patch.yaml

          cd ../..
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git config user.name "github-actions[bot]"
          git add overlays/prod/
          git diff --cached --quiet && echo "No changes to commit" && exit 0
          git commit -m "deploy(prod): dashboard-${VERSION} + worker-${VERSION}"
          git push
