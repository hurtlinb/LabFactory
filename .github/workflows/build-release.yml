name: Build & Deploy Prod

on:
  release:
    types: [published]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Get version
        id: version
        # Strip leading 'v' from tag (v1.3.2 → 1.3.2)
        run: echo "version=${GITHUB_REF_NAME#v}" >> $GITHUB_OUTPUT

      - name: Test customizations
        run: |
          npm ci --ignore-scripts
          node --test tests/kubernetesTasks.test.js tests/ansibleTasks.test.js tests/ansibleTasks.ui.test.js tests/customizationRecovery.test.js

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build & push dashboard
        uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/dashboard/Dockerfile
          push: true
          tags: hurtlinb/labfactory:dashboard-${{ steps.version.outputs.version }}
          build-args: BUILD_TAG=${{ steps.version.outputs.version }}
          cache-from: type=registry,ref=hurtlinb/labfactory:dashboard-buildcache
          cache-to: type=registry,ref=hurtlinb/labfactory:dashboard-buildcache,mode=max

      - name: Build & push worker
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile
          push: true
          tags: hurtlinb/labfactory:worker-${{ steps.version.outputs.version }}
          cache-from: type=registry,ref=hurtlinb/labfactory:worker-buildcache
          cache-to: type=registry,ref=hurtlinb/labfactory:worker-buildcache,mode=max

      - name: Build & push custom tasks runtime
        uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/custom-tasks/Dockerfile
          push: true
          tags: hurtlinb/labfactory:custom-tasks-${{ steps.version.outputs.version }}
          cache-from: type=registry,ref=hurtlinb/labfactory:custom-tasks-buildcache
          cache-to: type=registry,ref=hurtlinb/labfactory:custom-tasks-buildcache,mode=max

      - name: Update gitops repo (prod)
        env:
          GITLAB_TOKEN: ${{ secrets.GITLAB_TOKEN }}
          GITLAB_GITOPS_REPO_URL: ${{ secrets.GITLAB_GITOPS_REPO_URL }}
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          git clone "https://oauth2:${GITLAB_TOKEN}@${GITLAB_GITOPS_REPO_URL#https://}" gitops
          cd gitops/overlays/prod

          # Update container image tags
          kustomize edit set image \
            labfactory/dashboard=hurtlinb/labfactory:dashboard-${VERSION} \
            labfactory/worker=hurtlinb/labfactory:worker-${VERSION}

          # Update runner images in ConfigMap
          sed -i "s|TERRAFORM_RUNNER_IMAGE:.*|TERRAFORM_RUNNER_IMAGE: \"hurtlinb/labfactory:worker-${VERSION}\"|" configmap-patch.yaml
          sed -i "s|ANSIBLE_RUNNER_IMAGE:.*|ANSIBLE_RUNNER_IMAGE: \"hurtlinb/labfactory:worker-${VERSION}\"|" configmap-patch.yaml

          # Deploy the task runtime configuration and namespaced permissions atomically.
          cp -R "$GITHUB_WORKSPACE/deploy/kubernetes/custom-tasks" ./
          if ! grep -q 'custom-tasks' kustomization.yaml; then
            kustomize edit add component ./custom-tasks
          fi
          if grep -q '^  ANSIBLE_TASKS_IMAGE:' configmap-patch.yaml; then
            sed -i "s|^  ANSIBLE_TASKS_IMAGE:.*|  ANSIBLE_TASKS_IMAGE: \"hurtlinb/labfactory:custom-tasks-${VERSION}\"|" configmap-patch.yaml
          else
            printf '\n  ANSIBLE_TASKS_IMAGE: "hurtlinb/labfactory:custom-tasks-%s"\n' "${VERSION}" >> configmap-patch.yaml
          fi
          kubectl kustomize . > /dev/null

          cd ../..
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git config user.name "github-actions[bot]"
          git add overlays/prod/
          git diff --cached --quiet && echo "No changes to commit" && exit 0
          git commit -m "deploy(prod): dashboard-${VERSION} + worker-${VERSION}"
          git push
