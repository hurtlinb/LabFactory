- name: Apply Linux guest customization
  hosts: linux_timezone_targets
  gather_facts: false
  tasks:
    - name: Display lab context
      ansible.builtin.debug:
        msg: "Customizing {{ lab_instance_id | default('lab-demo') }} deployment {{ deployment_id | default('') }} on {{ inventory_hostname }} (run {{ run_id | default('demo-run') }})"

    - name: Set Linux timezone
      community.general.timezone:
        name: "{{ target_timezone }}"
      when:
        - target_timezone is defined
        - target_timezone is not none
        - target_timezone | string | trim != ""
        - target_timezone | string | lower != "null"

    - name: Set Linux hostname
      ansible.builtin.hostname:
        name: "{{ target_hostname }}"
      when:
        - target_hostname is defined
        - target_hostname | string | trim != ""

    - name: Install Docker CE prerequisites
      ansible.builtin.apt:
        name:
          - ca-certificates
          - curl
        state: present
        update_cache: true
      when: install_docker | default(false) | bool

    - name: Create /etc/apt/keyrings directory
      ansible.builtin.file:
        path: /etc/apt/keyrings
        state: directory
        mode: '0755'
      when: install_docker | default(false) | bool

    - name: Download Docker GPG key
      ansible.builtin.get_url:
        url: https://download.docker.com/linux/ubuntu/gpg
        dest: /etc/apt/keyrings/docker.asc
        mode: '0444'
      when: install_docker | default(false) | bool

    - name: Get dpkg architecture
      ansible.builtin.command: dpkg --print-architecture
      register: dpkg_arch
      changed_when: false
      when: install_docker | default(false) | bool

    - name: Get Ubuntu version codename
      ansible.builtin.shell: ". /etc/os-release && echo $VERSION_CODENAME"
      register: ubuntu_codename
      changed_when: false
      when: install_docker | default(false) | bool

    - name: Add Docker apt repository
      ansible.builtin.apt_repository:
        repo: "deb [arch={{ dpkg_arch.stdout }} signed-by=/etc/apt/keyrings/docker.asc] https://download.docker.com/linux/ubuntu {{ ubuntu_codename.stdout }} stable"
        state: present
        filename: docker
      when: install_docker | default(false) | bool

    - name: Install Docker CE
      ansible.builtin.apt:
        name:
          - docker-ce
          - docker-ce-cli
          - containerd.io
          - docker-buildx-plugin
          - docker-compose-plugin
        state: present
        update_cache: true
      when: install_docker | default(false) | bool

    - name: Add user to docker group
      ansible.builtin.user:
        name: "{{ ansible_user }}"
        groups: docker
        append: true
      when: install_docker | default(false) | bool

    - name: Discover second data disk device
      ansible.builtin.shell: |
        set -o pipefail
        lsblk -ndo NAME,TYPE | awk '$2=="disk"{print "/dev/"$1}' | sort | sed -n '2p'
      args:
        executable: /bin/bash
      register: second_disk_device
      changed_when: false
      when: second_disk_size_gb is defined

    - name: Partition second data disk
      community.general.parted:
        device: "{{ second_disk_device.stdout }}"
        number: 1
        state: present
        fs_type: ext4
      when:
        - second_disk_size_gb is defined
        - second_disk_device.stdout | default('') != ''

    - name: Format second data disk
      ansible.builtin.filesystem:
        dev: "{{ second_disk_device.stdout }}1"
        fstype: ext4
      when:
        - second_disk_size_gb is defined
        - second_disk_device.stdout | default('') != ''

    - name: Mount second data disk at /data
      ansible.posix.mount:
        path: /data
        src: "{{ second_disk_device.stdout }}1"
        fstype: ext4
        state: mounted
      when:
        - second_disk_size_gb is defined
        - second_disk_device.stdout | default('') != ''

    - name: Reboot Linux at end of customization
      ansible.builtin.reboot:
        reboot_timeout: 1800
        connect_timeout: 10
        post_reboot_delay: 15
