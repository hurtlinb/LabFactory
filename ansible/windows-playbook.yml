# ── Play 1 : Hostname, Timezone, Cloudbase-Init ───────────────────────────────
# Toutes les VMs Windows : applique hostname + timezone, redémarre une fois.
# Le DC reçoit ici son nouveau nom — obligatoire avant la promotion AD.
- name: Apply Windows hostname and timezone
  hosts: windows_timezone_targets
  gather_facts: false
  tasks:
    - name: Display lab context
      tags: [setup]
      ansible.builtin.debug:
        msg: "Customizing {{ lab_instance_id | default('lab-demo') }} deployment {{ deployment_id | default('') }} on {{ inventory_hostname }} (run {{ run_id | default('demo-run') }})"

    - name: Set Windows hostname
      tags: [setup]
      ansible.builtin.raw: |
        powershell -NoProfile -NonInteractive -Command "if ((Get-CimInstance Win32_ComputerSystem).Name -ne '{{ target_hostname }}') { Rename-Computer -NewName '{{ target_hostname }}' -Force -PassThru | Out-Null; Write-Output 'changed' }"
      register: windows_hostname_result
      changed_when: "'changed' in (windows_hostname_result.stdout | default(''))"
      when:
        - target_hostname is defined
        - target_hostname is not none
        - target_hostname | string | trim != ""
        - target_hostname | string | lower != "null"

    - name: Set Windows timezone
      tags: [setup]
      ansible.builtin.raw: |
        powershell -NoProfile -NonInteractive -Command "if ((Get-TimeZone).Id -ne '{{ target_timezone }}') { Set-TimeZone -Id '{{ target_timezone }}'; Write-Output 'changed' }"
      changed_when: "'changed' in (stdout | default(''))"
      when:
        - target_timezone is defined
        - target_timezone is not none
        - target_timezone | string | trim != ""
        - target_timezone | string | lower != "null"

    - name: Initialize and format second data disk
      tags: [setup]
      ansible.windows.win_powershell:
        script: |
          $disk = Get-Disk | Where-Object PartitionStyle -eq 'RAW' | Select-Object -First 1
          if ($disk) {
            Initialize-Disk -Number $disk.Number -PartitionStyle GPT -PassThru |
              New-Partition -UseMaximumSize -AssignDriveLetter |
              Format-Volume -FileSystem NTFS -NewFileSystemLabel 'Data' -Confirm:$false | Out-Null
            Write-Output 'changed'
          }
      register: windows_second_disk_result
      changed_when: "'changed' in (windows_second_disk_result.output | default([]) | join(' '))"
      when:
        - second_disk_size_gb is defined
        - second_disk_configure | default(true) | bool

    - name: Create uploaded file destination directory
      tags: [files]
      ansible.windows.win_file:
        path: "{{ item.directory }}"
        state: directory
      loop: "{{ file_uploads | default([]) }}"
      loop_control:
        label: "{{ item.destination }}"

    - name: Copy blueprint file to guest
      tags: [files]
      ansible.windows.win_copy:
        src: "{{ item.source }}"
        dest: "{{ item.destination }}"
        force: true  # Compare checksums and retain already completed transfers.
      loop: "{{ file_uploads | default([]) }}"
      loop_control:
        label: "{{ item.destination }}"

    - name: Reboot (applique le nouveau nom d'ordinateur)
      tags: [reboot]
      # Each invocation targets one VM. Wait for a changed boot time and readiness:
      # a WinRM response before shutdown must not release subsequent custom tasks.
      ansible.windows.win_reboot:
        reboot_timeout: 1800
        post_reboot_delay: 15
