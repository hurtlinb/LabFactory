- name: Apply Windows timezone customization
  hosts: windows_timezone_targets
  gather_facts: false
  tasks:
    - name: Display lab context
      ansible.builtin.debug:
        msg: "Customizing {{ lab_instance_id | default('lab-demo') }} deployment {{ deployment_id | default('') }} on {{ inventory_hostname }} (run {{ run_id | default('demo-run') }})"

    - name: Set Windows hostname
      ansible.builtin.raw: |
        powershell -NoProfile -NonInteractive -Command "if ((Get-CimInstance Win32_ComputerSystem).Name -ne '{{ target_hostname }}') { Rename-Computer -NewName '{{ target_hostname }}' -Force -PassThru | Out-Null; Write-Output 'changed' }"
      register: windows_hostname_result
      changed_when: "'changed' in (windows_hostname_result.stdout | default(''))"
      when:
        - target_hostname is defined
        - target_hostname is not none
        - target_hostname | string | trim != ""
        - target_hostname | string | lower != "null"

    - name: Set Windows timezone
      ansible.builtin.raw: |
        powershell -NoProfile -NonInteractive -Command "if ((Get-TimeZone).Id -ne '{{ target_timezone }}') { Set-TimeZone -Id '{{ target_timezone }}'; Write-Output 'changed' }"
      changed_when: "'changed' in (stdout | default(''))"
      when:
        - target_timezone is defined
        - target_timezone is not none
        - target_timezone | string | trim != ""
        - target_timezone | string | lower != "null"

    - name: Reboot Windows at end of customization
      ansible.builtin.raw: |
        powershell -NoProfile -NonInteractive -Command "Restart-Computer -Force"
      changed_when: true
      failed_when: false

    - name: Wait for Windows to come back after reboot
      ansible.builtin.wait_for_connection:
        timeout: 1800
        sleep: 10
        delay: 15

    - name: Wait for Cloudbase-Init to finish after reboot
      ansible.windows.win_powershell:
        script: |
          $flag = 'C:\ProgramData\cloudbase-init\done.flag'
          if (-not (Test-Path -LiteralPath $flag)) {
            Write-Error 'Cloudbase-Init has not finished'
            exit 1
          }

          $bootTime = (Get-CimInstance Win32_OperatingSystem).LastBootUpTime
          $flagTime = (Get-Item -LiteralPath $flag).LastWriteTime
          if ($flagTime -lt $bootTime) {
            Write-Error "Cloudbase-Init done flag is stale: $flagTime is before boot $bootTime"
            exit 1
          }

          $cloudbaseServices = Get-Service -Name 'cloudbase-init','cloudbaseinit' -ErrorAction SilentlyContinue
          $activeServices = @($cloudbaseServices | Where-Object { $_.Status -in @('StartPending', 'Running', 'ContinuePending') })
          if ($activeServices.Count -gt 0) {
            Write-Error "Cloudbase-Init service is still active: $($activeServices.Name -join ', ')"
            exit 1
          }

          Write-Output "Cloudbase-Init completed at $flagTime and WinRM is reachable"
      register: cloudbase_init_after_reboot
      until: cloudbase_init_after_reboot is succeeded
      retries: 180
      delay: 10

    - name: Confirm WinRM remains stable after Cloudbase-Init
      ansible.builtin.wait_for_connection:
        timeout: 120
        sleep: 5
        delay: 30
