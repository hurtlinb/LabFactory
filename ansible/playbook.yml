- name: Apply Windows timezone customization
  hosts: windows_timezone_targets
  gather_facts: false
  tasks:
    - name: Display lab context
      ansible.builtin.debug:
        msg: "Customizing {{ lab_instance_id | default('lab-demo') }} deployment {{ deployment_id | default('') }} on {{ inventory_hostname }} (run {{ run_id | default('demo-run') }})"

    - name: Set Windows hostname
      ansible.windows.win_hostname:
        name: "{{ target_hostname }}"
      register: windows_hostname_result
      when:
        - target_hostname is defined
        - target_hostname | string | trim != ""

    - name: Reboot Windows after hostname change
      ansible.windows.win_reboot:
        reboot_timeout: 1800
      when:
        - windows_hostname_result is defined
        - windows_hostname_result.reboot_required | default(false)

    - name: Set Windows timezone
      ansible.windows.win_timezone:
        timezone: "{{ target_timezone }}"
      when:
        - target_timezone is defined
        - target_timezone | string | trim != ""

- name: Apply Linux guest customization
  hosts: linux_timezone_targets
  gather_facts: false
  tasks:
    - name: Display lab context
      ansible.builtin.debug:
        msg: "Customizing {{ lab_instance_id | default('lab-demo') }} deployment {{ deployment_id | default('') }} on {{ inventory_hostname }} (run {{ run_id | default('demo-run') }})"

    - name: Set Linux timezone
      community.general.timezone:
        name: "{{ target_timezone }}"
      when:
        - target_timezone is defined
        - target_timezone | string | trim != ""

    - name: Set Linux hostname
      ansible.builtin.hostname:
        name: "{{ target_hostname }}"
      when:
        - target_hostname is defined
        - target_hostname | string | trim != ""
