apiVersion: v1
kind: ServiceAccount
metadata:
  name: labfactory-ansible-worker
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: labfactory-task-runner
automountServiceAccountToken: false
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: labfactory-custom-tasks
rules:
  - apiGroups: [batch]
    resources: [jobs]
    verbs: [create, get, delete]
  - apiGroups: ['']
    resources: [pods]
    verbs: [list]
  - apiGroups: ['']
    resources: [pods/log]
    verbs: [get]
  - apiGroups: ['']
    resources: [secrets]
    verbs: [create, delete]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: labfactory-custom-tasks
subjects:
  - kind: ServiceAccount
    name: labfactory-ansible-worker
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: labfactory-custom-tasks
